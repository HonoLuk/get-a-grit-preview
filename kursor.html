<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Get a Grit: Brand personality test | Small &amp; Gritty</title>
<meta name="description" content="A 49-question brand personality test for small businesses, by Small &amp; Gritty.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@400&family=Rubik:wght@400;900&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   1. BRAND TOKENS: colours and fonts live here and nowhere else.
   ===================================================================== */
:root {
  /* palette as written on Jana's brand board in Figma */
  --lime: #D6FD54;
  --cream: #E9E3DC;
  --olive: #706529;
  --graphite: #272324;
  --coral: #FF653A;

  /* fonts: change here (and in the Google Fonts <link> above) */
  --font-display: 'Rubik', system-ui, -apple-system, 'Segoe UI', sans-serif; /* logo, titles, nav */
  --font-body: 'Bitter', Georgia, 'Times New Roman', serif;                  /* everything else */

  --line: 1.5px solid currentColor;
  --gutter: clamp(1rem, .2rem + 3.1vw, 3.75rem);
}

/* ---------- base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  --bg: var(--cream);
  --fg: var(--graphite);
  margin: 0;
  min-height: 100svh;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 1.0625rem;
  line-height: 1.55;
}

h1, h2, h3, p, ul { margin: 0; font-weight: 400; }
a { color: inherit; }
button { font: inherit; color: inherit; cursor: pointer; border-radius: 0; }
:focus-visible { outline: 3px solid currentColor; outline-offset: 3px; }
[tabindex="-1"]:focus { outline: none; }
.display-font, h1, h2 { font-family: var(--font-display); font-weight: 900; }

.skip {
  position: absolute; left: var(--gutter); top: -5rem; z-index: 10;
  padding: .6rem 1rem; background: var(--graphite); color: var(--cream);
}
.skip:focus { top: .5rem; }

/* ---------- nav: link left, logo centre, link right ---------- */
.nav {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: .5rem;
  padding: clamp(1.1rem, .6rem + 2vw, 3.2rem) var(--gutter) 1rem;
  font-family: var(--font-display);
  font-size: clamp(.875rem, .75rem + .5vw, 1.3rem);
  line-height: 1.1;
}
.nav a { text-decoration: none; }
.nav-link { justify-self: start; padding: .35rem 0; white-space: nowrap; }
.nav-link:hover, .nav-link[aria-current="page"] { text-decoration: underline; text-underline-offset: 5px; }
.logo { display: block; width: clamp(7rem, 4.5rem + 9vw, 13.125rem); }
.logo svg { display: block; width: 100%; height: auto; fill: currentColor; }
/* the right-hand link sits on Jana's lime brush stroke */
.nav-link--brush { justify-self: end; position: relative; z-index: 0; color: var(--graphite); margin-right: .5em; }
.nav-link--brush svg {
  position: absolute; z-index: -1;
  left: -.7em; top: 50%;
  width: calc(100% + 1.2em); height: 1.15em;
  fill: var(--lime);
  transform: translateY(-50%) scaleY(-1);
}

main {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  width: 100%;
  padding: clamp(1.5rem, 1rem + 2vw, 3rem) var(--gutter) clamp(2.5rem, 2rem + 3vw, 5rem);
}

/* ---------- button ---------- */
.btn {
  display: inline-block;
  margin-top: 1.25rem;
  padding: .55rem 1.3rem;
  border: var(--line);
  border-radius: 999px;
  background: transparent;
  font-family: var(--font-display);
  font-size: 1rem;
  transition: background-color .15s, color .15s;
}
.btn:hover { background: var(--fg); color: var(--bg); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* ---------- dog ---------- */
.dog { display: block; width: 100%; height: auto; overflow: visible; }
.f-cream { fill: var(--cream); } .f-ink { fill: var(--graphite); } .f-coral { fill: var(--coral); }
.f-lime { fill: var(--lime); } .f-olive { fill: var(--olive); } .f-none { fill: none; }
.s-ink { stroke: var(--graphite); } .s-cream { stroke: var(--cream); } .s-coral { stroke: var(--coral); }
.s-lime { stroke: var(--lime); } .s-olive { stroke: var(--olive); }
[class*="s-"] { stroke-linejoin: round; stroke-linecap: round; }

/* subtle movement: the tongue slides out of the mouth, stays for a while and
   slides back in. It comes out of the opening of the mouth in Jana's drawing, from
   behind the upper lip (the lip's black line is drawn again on top of it). */
.dog-tongue { transform: translateY(-58px); animation: tongue 9s ease-in-out infinite; }
@keyframes tongue {
  0%, 28%, 86%, 100% { transform: translateY(-58px); }
  40% { transform: translateY(0); }
  52% { transform: translateY(-7px); }
  64% { transform: translateY(0); }
  74% { transform: translateY(-5px); }
}
/* ...and while the tongue is out, it winks: a closed lid flashes over one eye */
.dog-lids { opacity: 0; animation: blink 9s step-end infinite; }
@keyframes blink {
  0%, 100% { opacity: 0; }
  44% { opacity: 1; }
  47.5% { opacity: 0; }
}

/* ---------- home (follows Jana's "Home" frame in Figma) ---------- */
.home { width: 100%; }
.home-hero { display: grid; gap: 2rem; text-align: left; width: 100%; }
.home-title { font-size: 16.4vw; line-height: 1; white-space: nowrap; text-transform: uppercase; }
.home-sub { font-family: var(--font-display); font-weight: 900; font-size: clamp(1.6rem, 3vw, 3.4rem); line-height: 1.1; margin-top: .5em; }
.home-text { max-width: 36rem; margin-top: 1.5rem; }
.home-buy { display: flex; align-items: center; gap: 2rem; margin-top: 2.5rem; }
.home-buy .btn { margin: 0; }
.home-price { font-family: var(--font-display); font-weight: 900; font-size: clamp(1.6rem, 2.6vw, 3rem); line-height: 1; }
.home-dog { width: min(78%, 20rem); justify-self: end; }

/* The dog walks in and sits down (frames from a generated film, played by the
   page: see dogWalk). The box is the size of the sitting dog; the stage with
   the walk is wider and reaches out to the right of it. */
html, body { overflow-x: clip; }   /* the dog walks in from beyond the right edge of the window */
/* phone: the dog comes right under the headline, so it is seen walking in */
@media (max-width: 47.99rem) {
  .home-hero { gap: 0; }
  .home-copy { display: contents; }
  .home-title { order: 1; }
  .home-sub { order: 2; font-size: 1.55rem; }
  .home-dog.dog-walk-box { order: 3; width: min(66%, 17rem); justify-self: center; margin: 1.5rem 0 .25rem; }
  .home-text { order: 4; font-size: 1rem; line-height: 1.5; margin-top: 1.25rem; }
  .home-buy { order: 5; margin-top: 1.5rem; }
}
.home-dog.dog-walk-box { position: relative; aspect-ratio: 434.07 / 391.4; }
.dog-stage { position: absolute; left: -17.663%; top: -4.770%; width: 229.23%; aspect-ratio: 995 / 415; pointer-events: none; }
.dog-stage canvas, .dog-stage svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; overflow: visible; }
.dog-stage svg { pointer-events: auto; }
.dog-stage .dog-sit { opacity: 0; }
.dog-stage.is-sitting .dog-sit { opacity: 1; }
.dog-stage.is-sitting canvas { visibility: hidden; }

/* the glints in the dog's eyes follow the pointer (see the pointermove handler) */
.dog-gaze { transition: transform .12s ease-out; }

/* ---------- furry title (experiment on this copy): drawn on a canvas, see furTitle() ---------- */
.fur { display: block; }
/* the title is a looping 3D film (made in Blender, see media/); the film has
   .3em of empty room around the letters, taken back here with the margin */
.fur-film { display: block; width: 5.594em; max-width: none; aspect-ratio: 1400 / 508; margin: -.3em; pointer-events: none; }
.home-dog > .dog { animation: dog-float 6s ease-in-out infinite; }
@keyframes dog-float {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(-1.6%) rotate(-1deg); }
}

/* ---------- changing screens ---------- */
main.leave > * { opacity: 0; transform: translateY(-.6rem); transition: opacity .22s ease-in, transform .22s ease-in; }
main.enter > * > * { animation: rise .7s cubic-bezier(.2, .7, .2, 1) both; }
main.enter > * > *:nth-child(2) { animation-delay: .08s; }
main.enter > * > *:nth-child(3) { animation-delay: .16s; }
main.enter > * > *:nth-child(4) { animation-delay: .24s; }
main.enter > * > *:nth-child(n+5) { animation-delay: .32s; }
@keyframes rise { from { opacity: 0; transform: translateY(1.4rem); } }
/* in the test only the question changes; the progress bar stays put */
body[data-view="test"] main.leave > * { opacity: 1; transform: none; }
body[data-view="test"] main.leave .q-frame { opacity: 0; transform: translateY(-.6rem); transition: opacity .22s ease-in, transform .22s ease-in; }
body[data-view="test"] main.enter > * > *:not(.q-frame) { animation: none; }

/* ---------- text pages: quiz library, about ---------- */
.page { width: min(100%, 40rem); margin: 0 auto; align-self: flex-start; }
main:has(.page) { justify-content: flex-start; padding-top: clamp(2rem, 1rem + 5vw, 6rem); }
.lead { font-size: clamp(1.15rem, 1rem + .6vw, 1.45rem); line-height: 1.5; }
.lead + .lead { margin-top: 1.1em; }
.quiz + .quiz { margin-top: 2.5rem; }
.quiz-name { font-size: clamp(1.35rem, 1.1rem + 1vw, 1.75rem); line-height: 1.1; margin-bottom: .6rem; }

/* ---------- test: one framed box, question on top, answers below ---------- */
.q { width: min(100%, 60rem); margin: 0 auto; }
.q-frame { border: var(--line); }
.q-text {
  padding: clamp(1.5rem, 1rem + 2.6vw, 3rem) clamp(1rem, .6rem + 2vw, 2.5rem);
  font-size: clamp(1.5rem, 1rem + 2.3vw, 2.75rem);
  line-height: 1.1;
  text-align: center;
  text-wrap: balance;
}
.answers { display: grid; }
.answer {
  min-height: 4.25rem;
  padding: 1rem 1.1rem;
  border: 0;
  border-top: var(--line);
  background: transparent;
  font-size: clamp(1.125rem, .95rem + .8vw, 1.6rem);
  line-height: 1.25;
  text-align: center;
  text-wrap: balance;
  transition: background-color .15s, color .15s;
}
.answer:hover, .answer:focus-visible { background: var(--graphite); color: var(--cream); border-color: var(--graphite); }
.answer:focus-visible { outline-offset: -7px; }
.answer[aria-pressed="true"] { background: var(--lime); color: var(--graphite); }
.back {
  margin-top: 1rem; padding: .5rem 0;
  border: 0; background: none;
  font-family: var(--font-display); font-size: .9375rem;
  text-decoration: underline; text-underline-offset: 4px;
}
.back[disabled] { visibility: hidden; }

/* progress: pinned to the bottom of the test screen */
body[data-view="test"] main { padding-bottom: 6rem; }
.progress {
  position: fixed; left: 0; right: 0; bottom: 0;
  display: flex; align-items: center; gap: 1rem;
  padding: 1rem var(--gutter) 1.25rem;
  background: var(--bg);
  font-family: var(--font-display);
  font-size: .9375rem;
}
.progress-bar { flex: 1; height: .625rem; border: var(--line); }
.progress-bar span { display: block; height: 100%; background: var(--graphite); transition: width .25s; }
.progress-count { white-space: nowrap; font-variant-numeric: tabular-nums; }

/* ---------- result: plain text column ---------- */
.result-title { font-size: clamp(2.1rem, 9.6vw, 4.25rem); line-height: .98; text-transform: uppercase; }
.result-title span { display: block; }
.result-sub { font-size: clamp(1.15rem, 1rem + .7vw, 1.45rem); line-height: 1.3; margin-top: .8rem; }
.trait { margin-top: clamp(3rem, 2rem + 4vw, 5rem); }
.trait-name { font-size: clamp(1.6rem, 1.2rem + 1.6vw, 2.25rem); line-height: 1; text-transform: uppercase; }
.result-dog { width: min(100%, 26rem); margin-top: 2rem; }
.dog text { font-family: var(--font-display); font-weight: 900; }
.trait-dogline { margin-top: .5rem; }
.trait h3 { font-family: var(--font-display); font-size: .9375rem; margin: 1.5rem 0 .2rem; }

/* ---------- wider screens ---------- */
@media (min-width: 44rem) {
  .answers { grid-template-columns: repeat(3, 1fr); }
  .answer { min-height: clamp(6.5rem, 13vw, 10rem); border-left: var(--line); }
  .answer:first-child { border-left: 0; }
}
@media (min-width: 48rem) {
  .home-hero { grid-template-columns: auto auto; justify-content: center; align-items: center; gap: 1.2vw; padding-left: 4vw; }
  .home-dog.dog-walk-box { margin-left: 3vw; }
  .home-title { font-size: clamp(2.6rem, 7.6vw, 9rem); }
  .home-dog { width: clamp(15rem, 27.1vw, 32.5rem); justify-self: auto; }
}

@media (prefers-reduced-motion: reduce) {
  .dog-tongue, .dog-lids, .home-dog .dog, main.enter > * > * { animation: none; }
  * { transition: none !important; scroll-behavior: auto !important; }
}
</style>
</head>

/* PLACEHOLDER, do zastąpienia systemem Jany.
   Input:  answers = { questionId: value }, value is -1, 0 or +1 (see QUESTIONS).
   Output: array of the 3 strongest traits, each from a different slider:
           [{ trait: 'rebel', slider: 'conventional_rebel', score: 6 }, ...]
   Temporary logic: add up the values per slider; the 3 sliders with the biggest
   lean (absolute sum) win; a negative sum picks the left pole, a positive one
   the right pole. Ties keep SLIDERS order; a dead-even slider (sum 0) falls to
   its left pole. */
function calculateResult(answers) {
  const totals = SLIDERS.map(slider => {
    const sum = QUESTIONS
      .filter(q => q.slider === slider.id)
      .reduce((acc, q) => acc + (answers[q.id] || 0), 0);
    return { slider: slider.id, trait: sum > 0 ? slider.right : slider.left, score: Math.abs(sum) };
  });
  return totals.sort((a, b) => b.score - a.score).slice(0, 3);
}

/* The home dog: walks in, sits down, then shows its tongue and winks.
   The walk is a film (made with Kling from Jana's dog, her face pasted in
   unchanged), played frame by frame from media/piesek-wejscie-1..7.webp.
   The sitting dog it ends on is a still (media/piesek-siedzi.webp) with Jana's
   original head; the tongue, the lid and the pupils sit on it, placed with
   DOG_STAGE.grid (the same 1357 x 1072 grid as the dog above). */
const DOG_STAGE = { walkFrom: 489, walkEnd: 52, w: 995, h: 415, frames: 124, cols: 4, rows: 5, sheets: 7, fps: 24,
  still: [76.67, 18.67, 434.07, 391.4], grid: [0.265595, 39.599, -10.698] };
function renderWalkingDog(alt = COPY.dogAlt) {
  const S = DOG_STAGE, [x, y, w, h] = S.still;
  return `
  <div class="dog-stage">
    <canvas width="${S.w}" height="${S.h}" aria-hidden="true"></canvas>
    <svg class="dog dog-sit" viewBox="0 0 ${S.w} ${S.h}" role="img" aria-label="${esc(alt)}">
      <image href="media/piesek-siedzi.webp" x="${x}" y="${y}" width="${w}" height="${h}"/>
    </svg>
  </div>`;
}
function dogWalk() {
  const stage = main.querySelector('.dog-stage');
  if (!stage) return;
  const sit = () => stage.classList.add('is-sitting');
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) { sit(); return; }
  const S = DOG_STAGE, canvas = stage.querySelector('canvas'), ctx = canvas.getContext('2d');
  const imgs = []; let failed = false;
  const play = () => {
    if (failed || !stage.isConnected) { sit(); return; }
    // wait until the dog's place is on screen (on a phone it is below the headline)
    const box = stage.parentElement.getBoundingClientRect();
    if (box.top + box.height * 0.6 > window.innerHeight) { setTimeout(play, 250); return; }   // check again shortly (the layout may still be settling, or the visitor will scroll)
    const per = S.cols * S.rows; let t0 = null;
    // the film starts with the dog already in view; push it out past the right
    // edge of the window and bring it in while it walks (frames 0..S.walkEnd)
    const r = canvas.getBoundingClientRect();
    const dogLeft = r.left + S.walkFrom / S.w * r.width;
    const start = Math.max(0, document.documentElement.clientWidth - dogLeft + 8);
    const tick = now => {
      if (!stage.isConnected) return;
      if (t0 === null) t0 = now;
      const i = Math.floor((now - t0) / 1000 * S.fps);
      if (i >= S.frames) { canvas.style.transform = ''; sit(); return; }
      const k0 = Math.min(1, (now - t0) / 1000 * S.fps / S.walkEnd);
      // (no extra sliding: the dog only moves as it walks in the film)
      const k = i % per, im = imgs[Math.floor(i / per)];
      ctx.clearRect(0, 0, S.w, S.h);
      ctx.drawImage(im, (k % S.cols) * S.w, Math.floor(k / S.cols) * S.h, S.w, S.h, 0, 0, S.w, S.h);
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  };
  for (let n = 1; n <= S.sheets; n++) {
    const im = new Image();
    im.src = `media/piesek-wejscie-${n}.webp?v=8`;   // ?v= makes browsers fetch new frames after an update
    imgs.push(im);
  }
  // wait for every sheet to load and (where the browser allows) to decode, but
  // never longer than 1.5 s for the decoding, so the dog always comes in
  const ready = im => new Promise((ok, bad) => {
    const go = () => Promise.race([im.decode().catch(() => {}), new Promise(r => setTimeout(r, 1500))]).then(ok);
    if (im.complete && im.naturalWidth) go(); else { im.onload = go; im.onerror = bad; }
  });
  Promise.all(imgs.map(ready)).then(() => {
    imgs.forEach(im => ctx.drawImage(im, 0, 0, 1, 1, 0, 0, 1, 1));   // warm up each sheet once
    ctx.clearRect(0, 0, S.w, S.h);
    play();
  }, () => { failed = true; sit(); });
}

/* The result dog: Jana's dog (as she drew it, in the hoodie) wearing the

  return `<svg class="dog result-dog" viewBox="60 10 1380 1070" role="img" aria-label="${esc(alt)}">

/* FURRY TITLE. The word is covered with thousands of short hairs growing out
   of the letter shapes. They sway like fur in a breeze and bristle away from
   the pointer. A lime coat sits underneath, shifted, to give the letters depth.
   Settings worth playing with are in FUR. */
const FUR = {
  density: 0.5,         // hairs per px² of letter
  maxHairs: 26000,
  length: [0.04, 0.085], // hair length, in font sizes
  shades: ['#191617', '#272324', '#383334', '#4c4647', '#655e5f'],
  under: '#D6FD54',     // the coat underneath (brand lime, same as the nav brush stroke)
  depth: [0.045, 0.06], // how far the under-coat is shifted, in font sizes
  overhang: 0.016,     // how far a hair may stick out past the letter edge, in font sizes
  spacing: 0.03,        // extra space between letters, in font sizes
  wind: 0.6,            // how far a gust bends the hairs, in radians
  wave: 1.5,            // length of one gust wave, in font sizes
  speed: 1.1,           // how fast the gusts travel
  reach: 1.0,           // how far the pointer ruffles the fur, in font sizes
};
const furPointer = { x: -9999, y: -9999 };
window.addEventListener('pointermove', e => { furPointer.x = e.clientX; furPointer.y = e.clientY; dogLook(e.clientX, e.clientY); });

/* The dog watches the pointer. Its eyes stay exactly as Jana drew them (solid
   black); only the two light pupils slide inside them, together and by the same
   amount, so the dog never squints. GAZE = how far, on the dog's 1357 x 1072 grid. */
const GAZE = { x: 11, y: 7 };
function dogLook(px, py) {
  const gaze = document.querySelector('.home-dog .dog-gaze');
  if (!gaze || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const r = gaze.getBoundingClientRect();
  if (!r.width) return;
  const ex = r.left + r.width / 2, ey = r.top + r.height / 2; // between the eyes
  const dx = px - ex, dy = py - ey, d = Math.hypot(dx, dy) || 1;
  const k = Math.min(1, d / (r.width * 4)) / d;
  gaze.style.transform = `translate(${(dx * k * GAZE.x).toFixed(1)}px, ${(dy * k * GAZE.y).toFixed(1)}px)`;
}
window.addEventListener('pointerleave', () => { furPointer.x = furPointer.y = -9999; });

function furTitle(canvas) {
  const text = canvas.dataset.text;
  const h1 = canvas.parentElement, cs = getComputedStyle(h1);
  const fs = parseFloat(cs.fontSize), font = `900 ${fs}px ${cs.fontFamily}`;
  const pad = Math.ceil(fs * 0.2), base = pad + fs * 0.8;
  const probe = document.createElement('canvas').getContext('2d');
  probe.font = font;
  const spacing = (fs * FUR.spacing).toFixed(2) + 'px';
  if ('letterSpacing' in probe) probe.letterSpacing = spacing;
  const W = Math.ceil(probe.measureText(text).width) + pad * 2, H = Math.ceil(fs * 0.92) + pad * 2;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px'; canvas.style.margin = -pad + 'px';

  // where the letters are
  const mask = document.createElement('canvas'); mask.width = W; mask.height = H;
  const mc = mask.getContext('2d', { willReadFrequently: true });
  mc.font = font; if ('letterSpacing' in mc) mc.letterSpacing = spacing;
  mc.fillText(text, pad, base);
  const px = mc.getImageData(0, 0, W, H).data;
  let area = 0; for (let i = 3; i < px.length; i += 4) if (px[i] > 128) area++;
  const n = Math.min(FUR.maxHairs, Math.round(area * FUR.density));
  const X = new Float32Array(n), Y = new Float32Array(n), L = new Float32Array(n), A = new Float32Array(n), P = new Float32Array(n);
  const buckets = FUR.shades.map(() => []), top = pad + fs * 0.1, capH = fs * 0.72;
  for (let i = 0; i < n;) {
    const x = Math.random() * W, y = Math.random() * H;
    if (px[((y | 0) * W + (x | 0)) * 4 + 3] < 128) continue;
    X[i] = x; Y[i] = y;
    L[i] = fs * (FUR.length[0] + Math.random() * (FUR.length[1] - FUR.length[0]));
    A[i] = Math.PI * 0.62 + (Math.random() - 0.5) * 0.9;         // combed down and to the left, roughly
    P[i] = Math.random() * 6.283;
    // keep the letter shapes clean: a hair may only poke a little past the edge,
    // so it never fills the holes in A and R or the gaps between letters
    const cx = Math.cos(A[i]), sy = Math.sin(A[i]), over = fs * FUR.overhang;
    let inside = 0;
    for (let d = 1; d <= L[i]; d++) {
      const qx = (x + cx * d) | 0, qy = (y + sy * d) | 0;
      if (qx < 0 || qy < 0 || qx >= W || qy >= H || px[(qy * W + qx) * 4 + 3] < 128) break;
      inside = d;
    }
    L[i] = Math.min(L[i], inside + over);
    const light = 1 - Math.min(1, Math.max(0, (y - top) / capH)); // lighter near the top
    buckets[Math.min(FUR.shades.length - 1, Math.floor(Math.random() * 2.2 + light * 2.2))].push(i);
    i++;
  }
  const ctx = canvas.getContext('2d');
  const ox = fs * FUR.depth[0], oy = fs * FUR.depth[1], R = fs * FUR.reach, R2 = R * R;
  const tipX = new Float32Array(n), tipY = new Float32Array(n), midX = new Float32Array(n), midY = new Float32Array(n);
  const S = new Uint8Array(n);                       // each hair's own shade
  buckets.forEach((list, b) => list.forEach(i => { S[i] = b; }));
  const NS = FUR.shades.length, lists = FUR.shades.map(() => new Int32Array(n)), counts = new Int32Array(NS);
  const k1 = 6.283 / (fs * FUR.wave), k2 = 6.283 / (fs * FUR.wave * 2.3);

  function draw(t) {
    const rect = canvas.getBoundingClientRect();
    const mx = furPointer.x - rect.left, my = furPointer.y - rect.top;
    counts.fill(0);
    for (let i = 0; i < n; i++) {
      // gusts roll across the word as waves, so neighbouring hairs lean together
      const g = 0.65 * Math.sin((X[i] + Y[i] * 0.55) * k1 - t * FUR.speed * 2.2)
              + 0.35 * Math.sin((X[i] * 0.8 - Y[i]) * k2 - t * FUR.speed * 1.3 + 1.7);
      let a = A[i] + FUR.wind * g + 0.07 * Math.sin(t * 3.1 + P[i]);
      let len = L[i] * (1 + 0.18 * g);
      const sh = Math.max(0, Math.min(NS - 1, S[i] + Math.round(g * 1.4)));   // crests catch the light
      lists[sh][counts[sh]++] = i;
      const dx = X[i] - mx, dy = Y[i] - my, d2 = dx * dx + dy * dy;
      if (d2 < R2) {                       // bristle away from the pointer
        const w = 1 - d2 / R2;
        let diff = Math.atan2(dy, dx) - a;
        diff = Math.atan2(Math.sin(diff), Math.cos(diff));
        a += diff * w; len *= 1 + 0.45 * w;
      }
      midX[i] = X[i] + Math.cos(A[i]) * len * 0.5; midY[i] = Y[i] + Math.sin(A[i]) * len * 0.5;
      tipX[i] = X[i] + Math.cos(a) * len; tipY[i] = Y[i] + Math.sin(a) * len;
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.font = font; ctx.lineCap = 'round';
    if ('letterSpacing' in ctx) ctx.letterSpacing = spacing;
    // under-coat
    ctx.fillStyle = ctx.strokeStyle = FUR.under;
    ctx.fillText(text, pad + ox, base + oy);
    ctx.lineWidth = Math.max(0.8, fs * 0.009);
    ctx.beginPath();
    for (let i = 0; i < n; i += 3) { ctx.moveTo(X[i] + ox, Y[i] + oy); ctx.lineTo(tipX[i] + ox, tipY[i] + oy); }
    ctx.stroke();
    // top coat
    ctx.fillStyle = FUR.shades[1];
    ctx.fillText(text, pad, base);
    for (let b = 0; b < NS; b++) {
      const list = lists[b];
      ctx.strokeStyle = FUR.shades[b];
      ctx.beginPath();
      for (let k = 0; k < counts[b]; k++) { const i = list[k]; ctx.moveTo(X[i], Y[i]); ctx.quadraticCurveTo(midX[i], midY[i], tipX[i], tipY[i]); }
      ctx.stroke();
    }
  }

  if (matchMedia('(prefers-reduced-motion: reduce)').matches) { draw(0); return; }
  const loop = now => { if (!canvas.isConnected) return; draw(now / 1000); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}

/* FUR THAT FOLLOWS THE POINTER (test version): the 3D fur picture stays still;
   where the pointer moves over it, the coat is brushed along with it and then
   slowly settles back. Done by shifting small tiles of the picture. */
function furBrush(img) {
  const go = () => {
    if (!img.isConnected) return;
    const c = document.createElement('canvas'); c.className = 'fur-film'; c.setAttribute('aria-hidden', 'true');
    const IW = img.naturalWidth, IH = img.naturalHeight;
    c.width = IW; c.height = IH; img.replaceWith(c);
    const ctx = c.getContext('2d');
    const CELL = 10, GX = Math.ceil(IW / CELL), GY = Math.ceil(IH / CELL);
    const DX = new Float32Array(GX * GY), DY = new Float32Array(GX * GY);
    const R = 90, MAXD = 26;
    let last = null, running = false;
    const drawAll = () => {
      ctx.clearRect(0, 0, IW, IH);
      for (let gy = 0; gy < GY; gy++) for (let gx = 0; gx < GX; gx++) {
        const k = gy * GX + gx, x = gx * CELL, y = gy * CELL;
        ctx.drawImage(img, x - DX[k], y - DY[k], CELL + 1, CELL + 1, x, y, CELL + 1, CELL + 1);
      }
    };
    const step = () => {
      let any = false;
      for (let k = 0; k < DX.length; k++) {
        DX[k] *= 0.93; DY[k] *= 0.93;
        if (Math.abs(DX[k]) < 0.05) DX[k] = 0; if (Math.abs(DY[k]) < 0.05) DY[k] = 0;
        if (DX[k] || DY[k]) any = true;
      }
      drawAll();
      if (any) requestAnimationFrame(step); else running = false;
    };
    drawAll();
    window.addEventListener('pointermove', e => {
      if (!c.isConnected) return;
      const r = c.getBoundingClientRect(), s = IW / r.width;
      const x = (e.clientX - r.left) * s, y = (e.clientY - r.top) * s;
      if (last && x > -R && y > -R && x < IW + R && y < IH + R) {
        const vx = x - last[0], vy = y - last[1];
        for (let gy = Math.max(0, ((y - R) / CELL) | 0); gy <= Math.min(GY - 1, ((y + R) / CELL) | 0); gy++)
          for (let gx = Math.max(0, ((x - R) / CELL) | 0); gx <= Math.min(GX - 1, ((x + R) / CELL) | 0); gx++) {
            const dx = gx * CELL - x, dy = gy * CELL - y, d2 = dx * dx + dy * dy;
            if (d2 > R * R) continue;
            const w = (1 - d2 / (R * R)) * 0.35, k = gy * GX + gx;
            DX[k] = Math.max(-MAXD, Math.min(MAXD, DX[k] + vx * w));
            DY[k] = Math.max(-MAXD, Math.min(MAXD, DY[k] + vy * w));
          }
        if (!running) { running = true; requestAnimationFrame(step); }
      }
      last = [x, y];
    });
  };
  if (img.complete && img.naturalWidth) go(); else img.addEventListener('load', go, { once: true });
}

function startFur() {
  // The title starts as a still picture, so no browser can ever put a play
  // button on it. Then the loop takes over: the page draws it frame by frame
  // (see furFrames); where a film is sure to start on its own, the sharper film is used.
  const still = main.querySelector('img.fur-film');
  if (still) {
    furBrush(still); return;
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const safari = /^((?!chrome|chromium|android).)*safari/i.test(navigator.userAgent);
    if (safari) { furFrames(still); return; }
    const film = document.createElement('video');
    film.className = 'fur-film'; film.muted = true; film.loop = true; film.playsInline = true;
    film.setAttribute('aria-hidden', 'true'); film.tabIndex = -1; film.disablePictureInPicture = true;
    film.addEventListener('error', () => furFrames(still));
    film.addEventListener('playing', () => { if (still.isConnected) still.replaceWith(film); }, { once: true });
    film.src = 'media/fix-your-attitude-fur.webm';
    const p = film.play(); if (p) p.catch(() => furFrames(still));
    return;
  }
  const canvas = main.querySelector('canvas.fur');
  if (!canvas) return;
  const ready = document.fonts && document.fonts.load ? document.fonts.load('900 60px Rubik').catch(() => {}) : Promise.resolve();
  ready.then(() => { if (canvas.isConnected) furTitle(canvas); });
}
/* The fur loop without a film: the frames sit side by side on a few big
   pictures (media/fix-your-attitude-fur-1.webp ...), and the page draws them
   one after another, blending each into the next so the motion stays smooth. */
const FUR_FRAMES = { sheets: 3, cols: 5, rows: 4, frames: 60, fps: 12, w: 840, h: 304 };
function furFrames(el) {
  if (!el.isConnected || el.dataset.frames) return;
  el.dataset.frames = '1';
  const F = FUR_FRAMES, imgs = [];
  let left = F.sheets, failed = false;
  const start = () => {
    if (failed || !el.isConnected) return;
    const c = document.createElement('canvas');
    c.className = 'fur-film'; c.width = F.w; c.height = F.h; c.setAttribute('aria-hidden', 'true');
    const ctx = c.getContext('2d');
    const draw = (i, alpha, mode) => {
      const per = F.cols * F.rows, k = i % per;
      ctx.globalCompositeOperation = mode; ctx.globalAlpha = alpha;
      ctx.drawImage(imgs[Math.floor(i / per)], (k % F.cols) * F.w, Math.floor(k / F.cols) * F.h, F.w, F.h, 0, 0, F.w, F.h);
    };
    const tick = now => {
      if (!c.isConnected) return;
      const t = (now / 1000 * F.fps) % F.frames, i = Math.floor(t), f = t - i;
      ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1; ctx.clearRect(0, 0, F.w, F.h);
      draw(i, 1 - f, 'source-over'); draw((i + 1) % F.frames, f, 'lighter');
      requestAnimationFrame(tick);
    };
    el.replaceWith(c);
    requestAnimationFrame(tick);
  };
  for (let n = 0; n < F.sheets; n++) {
    const im = new Image();
    im.onload = () => { if (--left === 0) start(); };
    im.onerror = () => { failed = true; };   // no frames: the still picture stays
    im.src = `media/fix-your-attitude-fur-${n + 1}.webp`;
    imgs.push(im);
  }
}

      <h1 class="result-title" tabindex="-1">${ids.map(id => `<span>${esc(TRAITS[id].name)}</span>`).join('')}</h1>
      <p class="result-sub">Your three strongest brand traits.</p>
      ${renderResultDog(ids, `Jana’s small dog in its black hoodie, with: ${worn}.`)}
      ${top.map(r => { const t = TRAITS[r.trait]; return `
      <article class="trait">
        <h2 class="trait-name">${esc(t.name)}</h2>
        <p class="trait-dogline">On the dog: ${esc(ACCESSORIES[r.trait].label)}.</p>
        <h3>Who you are</h3><p>${esc(t.who)}</p>
        <h3>How people see you</h3><p>${esc(t.seen)}</p>
        <h3>Risks</h3><p>${esc(t.risks)}</p>
        <h3>Bonuses</h3><p>${esc(t.bonuses)}</p>
      </article>`; }).join('')}
    </section>`;
  },
};

const TITLES = { home: 'Get a Grit', library: 'Test library', about: 'About', test: 'Brand personality test', result: 'Your result' };

/* Navigation keeps the current screen in memory (state.view). The URL hash
   is only a mirror of it, so the page also works where the address cannot
   change (file previews, embedded frames). */
const viewFromHash = () => { const name = location.hash.replace(/^#\/?/, '') || 'home'; return views[name] ? name : 'home'; };
const currentView = () => state.view;

function go(name) {
  if (name === 'result' && !state.result) name = 'home';
  state.view = name;
  try { if (viewFromHash() !== name) history.pushState(null, '', name === 'home' ? '#/' : '#/' + name); } catch (e) { /* address is locked: carry on */ }
  render();
}

/* Screens and questions change with a short fade: the old one slips away,
   the new one rises in piece by piece. */
let leaving = false;
function render(moveFocus = true) {
  if (!moveFocus || !main.firstChild || matchMedia('(prefers-reduced-motion: reduce)').matches) return paint(moveFocus);
  if (leaving) return;
  leaving = true;
  main.classList.remove('enter'); main.classList.add('leave');
  setTimeout(() => { leaving = false; main.classList.remove('leave'); paint(true); void main.offsetWidth; main.classList.add('enter'); }, 240);
}
function paint(moveFocus) {
  const name = currentView();
  document.body.dataset.view = name;
  document.title = `${TITLES[name]} | Small & Gritty`;
  document.querySelectorAll('[data-nav]').forEach(a => {
    if (a.dataset.nav === name) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  });
  main.innerHTML = views[name]();
  startFur();
  dogWalk();
  if (moveFocus) {
    window.scrollTo(0, 0);
    const h = main.querySelector('h1');
    if (h) h.focus({ preventScroll: true });
  }
}

function startTest() {
  state.answers = {}; state.index = 0; state.result = null;
  go('test');
}

main.addEventListener('click', e => {
  const el = e.target.closest('button');
  if (!el || leaving) return;
  if (el.hasAttribute('data-start')) return startTest();
  if (el.hasAttribute('data-back')) { if (state.index > 0) { state.index--; render(); } return; }
  if (el.hasAttribute('data-answer')) {
    const q = QUESTIONS[state.index];
    state.answers[q.id] = q.answers[+el.dataset.answer].value;
    if (state.index < QUESTIONS.length - 1) { state.index++; render(); }
    else { state.result = calculateResult(state.answers); go('result'); }
  }
});

/* in-page links (nav, logo) */
document.addEventListener('click', e => {
  const a = e.target.closest('a[href^="#/"]');
  if (!a || e.metaKey || e.ctrlKey || e.shiftKey) return;
  e.preventDefault();
  const name = a.getAttribute('href').replace(/^#\/?/, '') || 'home';
  go(views[name] ? name : 'home');
});
/* browser back / forward */
window.addEventListener('popstate', () => { const name = viewFromHash(); state.view = (name === 'result' && !state.result) ? 'home' : name; render(); });
document.addEventListener('DOMContentLoaded', () => { const name = viewFromHash(); state.view = (name === 'result' && !state.result) ? 'home' : name; render(false); });
</script>
